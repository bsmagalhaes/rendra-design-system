# Publica @rendra-ui/web no npm quando uma tag v* é empurrada (ex.: v2.1.0). A tag precisa
# bater com "version" do package.json, checado abaixo antes de publicar.
name: Publicar pacote (npm)

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # O trusted publishing exige npm 11.5.1 ou mais recente. O Node 24 do runner costuma
      # trazer uma 11.x recente, mas nem toda 24.x: se vier menor, atualiza; sempre imprime a
      # versão usada, para o log da publicação provar qual npm assinou.
      - name: npm com suporte a trusted publishing (11.5.1 ou mais recente)
        run: |
          NPM_ATUAL="$(npm --version)"
          MENOR="$(printf '%s\n%s\n' 11.5.1 "$NPM_ATUAL" | sort -V | head -n1)"
          if [ "$MENOR" != "11.5.1" ]; then
            echo "npm $NPM_ATUAL é anterior à 11.5.1; atualizando."
            npm install -g npm@^11.5.1
          fi
          echo "npm em uso: $(npm --version)"
      - run: npm ci
      - run: npm run build:lib
      - run: npm run verify:pack
      - name: Tag bate com a version do package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG não bate com a version $PKG do package.json." >&2
            exit 1
          fi
      # Trusted publishing do npm: o pacote tem este repositório e este workflow cadastrados
      # com "npm publish" permitido. Não usa token; o id-token do GitHub autentica e assina
      # o atestado de proveniência.
      - name: Publicar pelo trusted publishing
        run: npm publish --provenance --access public
