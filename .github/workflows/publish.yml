# Publica @rendra-ui/web no npm quando uma tag v* é empurrada (ex.: v2.1.0). A tag precisa
# bater com "version" do package.json, checado abaixo antes de publicar.
name: Publicar pacote (npm)

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build:lib
      - run: npm run verify:pack
      - name: Tag bate com a version do package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG não bate com a version $PKG do package.json." >&2
            exit 1
          fi
      # Publica pelo segredo NPM_TOKEN. O workflow não pede id-token: com ele, o npm tenta
      # o trusted publishing antes do token e recusa com 403 enquanto o trusted publisher do
      # pacote no npm só permitir "npm stage publish". Para voltar ao trusted publishing com
      # atestado de proveniência: marque "Allow npm publish" no npm, devolva "id-token: write"
      # às permissões e troque este passo por "npm publish --provenance --access public".
      - name: Publicar com o token
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
