# Publica @rendra-ui/web no npm quando uma tag v* é empurrada (ex.: v2.1.0). A tag precisa
# bater com "version" do package.json, checado abaixo antes de publicar.
name: Publicar pacote (npm)

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build:lib
      - run: npm run verify:pack
      - name: Tag bate com a version do package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG não bate com a version $PKG do package.json." >&2
            exit 1
          fi
      # Dois caminhos. Com o segredo NPM_TOKEN, publica pelo token: as variáveis do OIDC
      # ficam vazias para o npm não tentar o trusted publishing (que recusa com 403 quando
      # o pacote não tem o GitHub cadastrado) e, sem OIDC, não há atestado de proveniência.
      # Sem o segredo, publica pelo trusted publishing, com --provenance.
      - name: Publicar com o token
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
      - name: Publicar pelo trusted publishing
        if: ${{ env.NPM_TOKEN == '' }}
        run: npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
