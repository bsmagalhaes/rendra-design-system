# Atualiza as referências da regressão visual depois de uma mudança visual intencional.
# Duas formas de rodar, sempre no branch do Pull Request (nunca na main, que é protegida):
#   1. no PR, aplique o rótulo "atualizar-visual" (o rótulo sai sozinho ao terminar);
#   2. na aba Actions, rode "Atualizar referências visuais" escolhendo o branch.
# O workflow gera as capturas no Linux e faz um commit no próprio branch.
name: Atualizar referências visuais

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  atualizar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'atualizar-visual' }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:visual:update
      - name: Commit das referências
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "Nenhuma referência mudou."
          else
            git commit -m "Atualiza referências visuais"
            git push
          fi
      - name: Tira o rótulo
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label atualizar-visual || true
