# Publica o demo no GitHub Pages (gratuito para repositório público) a cada push na main:
#   https://bsmagalhaes.github.io/rendra-design-system/            vitrine e telas
#   https://bsmagalhaes.github.io/rendra-design-system/storybook/  Storybook
name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build do app
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # O GitHub Pages não conhece as rotas do app: o 404.html devolve o próprio app,
      # que abre a tela certa pelo endereço (link direto para /clientes funciona).
      - run: cp dist/index.html dist/404.html
      - name: Registry do shadcn (dist/r)
        run: npm run registry:build
      - name: Build do Storybook
        run: npm run build-storybook -- --quiet --output-dir dist/storybook
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
