# Publica o demo no GitHub Pages (gratuito para repositório público) a cada push na main:
#   https://bsmagalhaes.github.io/rendra-design-system/            vitrine e telas
#   https://bsmagalhaes.github.io/rendra-design-system/storybook/  Storybook
name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build do app
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # SEO e AEO: uma página por rota (link direto responde 200 e o buscador indexa cada
      # tela), 404.html para o resto, sitemap.xml, robots.txt e llms.txt.
      - name: Páginas por rota, sitemap, robots e llms.txt
        run: node scripts/seo-build.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Registry do shadcn (dist/r)
        run: npm run registry:build
      - name: Build do Storybook
        run: npm run build-storybook -- --quiet --output-dir dist/storybook
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
