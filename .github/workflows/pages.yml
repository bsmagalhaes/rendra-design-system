# Publica o site no GitHub Pages a cada push na main:
#   https://bsmagalhaes.github.io/rendra-ui-web/            página de apresentação
#   https://bsmagalhaes.github.io/rendra-ui-web/demo/       vitrine e telas (a demo)
#   https://bsmagalhaes.github.io/rendra-ui-web/storybook/  Storybook
#   https://bsmagalhaes.github.io/rendra-ui-web/r/          registry do shadcn
# O mesmo script monta a árvore no CI e na máquina do desenvolvedor: npm run pages:build.
name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build da demo em /<repo>/demo/, SEO (uma página por rota, sitemap, robots e llms.txt),
      # registry (r/), Storybook e composição da árvore em .pages/<repo>. O endereço vem de
      # GITHUB_REPOSITORY, então um fork publica no próprio endereço.
      - name: Build da demo, registry, Storybook e composição do site
        run: node scripts/pages-build.mjs --storybook
      - name: Confere a árvore montada
        run: test -f .pages/${{ github.event.repository.name }}/storybook/index.html && test -f .pages/${{ github.event.repository.name }}/r/select.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .pages/${{ github.event.repository.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
