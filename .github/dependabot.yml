# Avisa por Pull Request quando dependências e actions ganham versão nova.
# Cada PR passa pelo CI inteiro antes de você decidir o merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Atualizações pequenas juntas, para não virar um PR por pacote.
      menores:
        update-types: [minor, patch]
      storybook:
        patterns: ['storybook', '@storybook/*']
    # Sem ignore: versões maiores (ESLint 10, TanStack Table 9) também chegam como PR, e o
    # CI mostra se já dá para atualizar. Se quebrar, feche o PR com um comentário: a
    # migração vira um PR próprio (ESLint e @eslint/js sobem juntos).

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
