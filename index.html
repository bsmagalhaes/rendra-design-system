    <script>
      // Aplica modo e marca antes da pintura para evitar flash de tema errado.
      try {
        var m = localStorage.getItem('ui-mode') || 'system'
        var dark =
          m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        var b = localStorage.getItem('ui-brand')
        if (b) document.documentElement.dataset.brand = b
        var p = localStorage.getItem('ui-palette') || b
        if (p) document.documentElement.dataset.palette = p
      } catch (e) {}
    </script>
